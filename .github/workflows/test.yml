name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.88"

jobs:
  unit-tests-linux:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libglib2.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib

  ssh-integration-linux:
    name: SSH Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libglib2.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate test SSH keys
        run: |
          cd tests/docker/test_keys
          chmod +x generate_keys.sh
          ./generate_keys.sh

      - name: Start SSH test containers
        run: |
          cd tests/docker
          docker compose up -d --build --wait
          docker compose ps

      - name: Wait for SSH server
        run: |
          for i in {1..30}; do
            nc -z localhost 2222 && break
            echo "Waiting for SSH server... (attempt $i)"
            sleep 1
          done
          nc -z localhost 2222 || exit 1

      - name: Run SSH integration tests
        run: cargo test --test ssh_integration -- --test-threads=1
        env:
          RUST_LOG: debug

      - name: Test Hub management SSH, SFTP and sudo
        run: python3 scripts/test-hub-ssh.py

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          cd tests/docker
          docker compose logs > docker-logs.txt

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: tests/docker/docker-logs.txt

      - name: Cleanup containers
        if: always()
        run: |
          cd tests/docker
          docker compose down -v

  portal-hub-contracts:
    name: Portal Hub Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portal
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libglib2.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run contract-backed unit tests
        run: cargo test --lib
        env:
          PORTAL_HUB_CONTRACT_DIR: ${{ github.workspace }}/hub/contracts/portal-hub/v2

  hub-tests:
    name: Hub Runtime (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Keep kernel networking tests on the same LTS for both architectures.
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Install Hub test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client dtach util-linux pkg-config
          sudo mkdir -p /run/sshd
          # The pinned sidecar exercises legacy iptables inside its own namespace.
          sudo modprobe iptable_filter
      - uses: Swatinem/rust-cache@v2
      - name: Test Hub and compatibility fixtures
        run: cargo test --locked -p portal-hub
      - name: Check Hub
        run: cargo clippy --locked -p portal-hub --all-targets -- -D warnings
      - name: Test deployment manager
        run: python3 -m unittest discover -s deploy/hub/tests -v
      - name: Build Hub container
        run: docker build -f deploy/hub/Dockerfile -t portal-hub:ci .
      - name: Validate actual container bootstrap and restart
        run: python3 scripts/test-hub-container.py portal-hub:ci
      - name: Validate pinned Tailscale networking
        run: python3 scripts/test-hub-sidecar.py portal-hub:ci
      - name: Validate real Docker image import
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("hub/Cargo.toml", "rb"))["package"]["version"])')
          docker tag portal-hub:ci "localhost/portal-hub:$version"
          python3 scripts/test-hub-image-import.py "localhost/portal-hub:$version"
      - name: Validate real bind-mount guards
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/test-hub-mounts.py

  android-contracts:
    name: Android Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Android client
        uses: actions/checkout@v6
        with:
          repository: DigitalPals/portal-android
          path: portal-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check Android contract and pairing compatibility
        working-directory: portal-android
        env:
          PORTAL_HUB_CONTRACT_DIR: ${{ github.workspace }}/hub/contracts/portal-hub/v2
        run: |
          ./gradlew testOssDebugUnitTest \
            --tests org.connectbot.portal.PortalHubContractTest \
            --tests org.connectbot.portal.PortalHubRepositoryTest

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libglib2.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          # RUSTSEC-2023-0071 has no fixed rsa release.
          # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 require quick-xml >= 0.41.0,
          # but current plist and wayland-scanner releases still constrain
          # quick-xml below that fixed version. Keep these explicit so any new
          # non-ignored vulnerability still fails CI.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
