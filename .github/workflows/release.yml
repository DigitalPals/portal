name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
      hub_image: ${{ steps.version.outputs.hub_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Portal and Portal Hub share one version and one release: each Portal
      # release deploys the Hub image built from the same commit.
      - name: Validate release tag, shared version and green CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          HUB_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("hub/Cargo.toml", "rb"))["package"]["version"])')
          TAG="${GITHUB_REF_NAME}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version v$VERSION"
            exit 1
          fi
          if [ "$HUB_VERSION" != "$VERSION" ]; then
            echo "::error::hub/Cargo.toml version $HUB_VERSION must equal Cargo.toml version $VERSION"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo '::error::The release commit must first pass the main Tests workflow.'
            exit 1
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hub_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portal-hub" >> "$GITHUB_OUTPUT"
          echo "::notice::Will create release $TAG with Portal Hub image $VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libglib2.0-dev

      - name: Install Linux packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install AppImage tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-appimage-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Package DEB
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --no-strip
          deb_path=$(ls target/${{ matrix.target }}/debian/*.deb | head -n 1)
          mv "$deb_path" portal-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.deb

      - name: Package RPM
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          rpm_path=$(ls target/${{ matrix.target }}/generate-rpm/*.rpm | head -n 1)
          mv "$rpm_path" portal-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.rpm

      - name: Package AppImage
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p AppDir/usr/bin
          cp target/${{ matrix.target }}/release/portal AppDir/usr/bin/portal
          APPIMAGE_EXTRACT_AND_RUN=1 \
            LINUXDEPLOY_PLUGIN_APPIMAGE=linuxdeploy-plugin-appimage-x86_64.AppImage \
            ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file assets/app-icons/portal.desktop \
            --icon-file assets/app-icons/portal.svg \
            --output appimage
          appimage_path=$(ls Portal-*.AppImage | head -n 1)
          mv "$appimage_path" portal-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.AppImage

      - name: Package tarball
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../portal-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.tar.gz portal
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: portal-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            portal-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.*

  hub-image:
    name: Publish Portal Hub image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.hub_image }}:${{ needs.prepare.outputs.number }}
          build-args: HUB_VERSION=${{ needs.prepare.outputs.number }}
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.prepare.outputs.hub_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Write Hub release metadata
        env:
          HUB_IMAGE: ${{ needs.prepare.outputs.hub_image }}
          HUB_VERSION: ${{ needs.prepare.outputs.number }}
          HUB_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("hub-release.json").write_text(json.dumps({
              "version": os.environ["HUB_VERSION"],
              "image": os.environ["HUB_IMAGE"],
              "digest": os.environ["HUB_DIGEST"],
              "api_versions": [2],
              "deployment_protocol": 1,
              "platforms": ["linux/amd64", "linux/arm64"],
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: hub-release
          path: hub-release.json

  validate-appimage:
    name: Validate AppImage
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: portal-linux-x86_64

      - name: Validate AppImage contents
        shell: bash
        run: |
          appimage=$(ls *.AppImage | head -n 1)
          if [ -z "$appimage" ]; then
            echo "No AppImage found to validate."
            exit 1
          fi
          chmod +x "$appimage"
          "./$appimage" --appimage-extract
          test -f squashfs-root/portal.desktop
          if [ ! -f squashfs-root/usr/share/icons/hicolor/256x256/apps/portal.png ] && \
             [ ! -f squashfs-root/usr/share/icons/hicolor/256x256/apps/portal-256.png ] && \
             [ ! -f squashfs-root/usr/share/icons/hicolor/scalable/apps/portal.svg ]; then
            echo "Expected portal icon not found in AppImage."
            exit 1
          fi

  release:
    name: Create Release
    needs: [prepare, build, validate-appimage, hub-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum portal-* hub-release.json > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.number, '-') }}
          files: artifacts/*
