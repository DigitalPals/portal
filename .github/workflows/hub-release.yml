name: Hub Release

on:
  push:
    tags: ['hub-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate component tag and green candidate CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("hub/Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "hub-v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo '::error::The release candidate must first pass the main Tests workflow.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portal-hub" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish compatible amd64 and arm64 images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          build-args: HUB_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.validate.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Write release metadata
        env:
          HUB_IMAGE: ${{ needs.validate.outputs.image }}
          HUB_VERSION: ${{ needs.validate.outputs.version }}
          HUB_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("hub-release.json").write_text(json.dumps({
              "version": os.environ["HUB_VERSION"],
              "image": os.environ["HUB_IMAGE"],
              "digest": os.environ["HUB_DIGEST"],
              "api_versions": [2],
              "deployment_protocol": 1,
              "platforms": ["linux/amd64", "linux/arm64"],
          }, indent=2) + "\n")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          name: Portal Hub ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: hub-release.json
